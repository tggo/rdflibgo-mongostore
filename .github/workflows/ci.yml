name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      # Docker is available on ubuntu-latest, so the suite starts its own
      # standalone mongod. There is nothing else worth running: a store that is
      # never pointed at a server proves nothing.
      - name: Integration tests
        run: go test -tags=integration -count=1 -timeout 900s ./...
