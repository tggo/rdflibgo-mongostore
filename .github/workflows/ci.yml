name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      # Docker is available on ubuntu-latest, so the suite starts its own
      # standalone mongod. There is nothing else worth running: a store that is
      # never pointed at a server proves nothing.
      # MongoDB 8.x refuses to start on Linux 6.19+ (SERVER-121912), which
      # GitHub's runners now have; 7.0 is not affected. Move back to the
      # default 8 once the runner kernel is 7.0.14+ or MongoDB ships a fix.
      - name: Integration tests
        env:
          MONGO_TAG: '7.0'
        run: go test -tags=integration -count=1 -timeout 900s ./...
