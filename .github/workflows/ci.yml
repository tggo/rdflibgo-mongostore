name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The two checkouts are siblings inside the workspace so that the `replace
# github.com/tggo/goRDFlib => ../rdflibgo` in go.mod resolves. That replace is
# temporary: this backend depends on store/storetest and
# store.ReachabilityStore, which are on goRDFlib's main branch and not yet in a
# tagged release.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rdflibgo-mongostore

      - name: Check out goRDFlib
        uses: actions/checkout@v4
        with:
          repository: tggo/goRDFlib
          path: rdflibgo

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        working-directory: rdflibgo-mongostore
        run: go build ./...

      - name: Vet
        working-directory: rdflibgo-mongostore
        run: |
          go vet ./...
          go vet -tags=integration ./...

      # Docker is available on ubuntu-latest, so the suite starts its own
      # mongod. There is nothing else worth running: a store that is never
      # pointed at a server proves nothing.
      - name: Integration tests
        working-directory: rdflibgo-mongostore
        run: go test -tags=integration -count=1 -timeout 900s ./...
